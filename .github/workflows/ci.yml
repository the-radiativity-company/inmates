name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: make install

      - name: Run tests
        run: make tests

      - name: CLI smoke test
        run: .venv/bin/inmates collate --help

  # Single required status check for branch protection; green only when every matrix leg is.
  CI:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "all checks passed"
